name: Go_Release

on:
  workflow_dispatch:
    inputs:
      pppoe_username:
        description: 'PPPoE 宽带账号 (留空使用默认值 "-")'
        required: false
        default: '-'
      pppoe_password:
        description: 'PPPoE 宽带密码 (留空使用默认值 "-")'
        required: false
        default: '-'
      clean_build:
        description: '强制全量编译（不恢复缓存并清空中间产物）'
        type: boolean
        default: false
  schedule:
    # 每 7 天编译一次（UTC 时间，北京时间 = UTC+8）
    # UTC 20:00 = 北京时间 04:00
    - cron: '0 20 */7 * *'

env:
  DEVICE_MODEL: link_nn6000v2_immwrt
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: main
  BUILD_DIR: imm-nss
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    permissions:
      actions: write
      contents: write
    strategy:
      matrix:
        os: [ubuntu-24.04] # 保持 24.04，因为上游脚本现在主要适配新版
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      
      - name: Build System Setup
        run: |
          echo "=== Disk Space Before Cleanup ==="
          df -h
          
          # 1. 清理预装软件，释放空间
          sudo apt-get purge -y \
            dotnet* ghc* libboost* android* swift* \
            chromium* chrome* firefox* ffmpeg* \
            powershell* codeql* microsoft* || true
          
          sudo apt-get autoremove -y --purge
          sudo docker system prune -a -f 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "=== Disk Space After Cleanup ==="
          df -h
          
          # 2. 【核心修复】初始化构建环境
          # 原链接已死，这里替换为 ImmortalWrt 官方 GitHub 仓库的最新脚本
          # 增加了 || true 防止因为网络波动导致整个流水线直接报错中断
          echo "正在初始化构建环境..."
          curl -sSL https://raw.githubusercontent.com/immortalwrt/build-scripts/refs/heads/master/init_build_environment.sh | sudo bash || {
            echo "官方脚本执行失败，尝试手动安装基础依赖以防万一..."
            sudo apt-get update
            sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget
          }
          
          # 3. 安装额外依赖 (针对 NN6000V2 或特定插件)
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev
          
          # 4. 清理安装产生的缓存
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo rm -rf /var/lib/apt/lists/*
          
          sudo -E systemctl daemon-reload
          
          echo "=== Final Disk Space ==="
          df -h

      - name: Set Build Date and Timezone
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "BUILD_SRC=${{ env.REPO_URL }}" >> $GITHUB_ENV

      - name: Clone Source Code
        run: |
          chmod +x ./nn6000v2/scripts/update.sh
          chmod +x ./nn6000v2/scripts/build.sh
          
          echo "克隆仓库：${{ env.REPO_URL }} 分支：${{ env.REPO_BRANCH }}"
          git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} ./action_build
          cd ./action_build && git rev-parse HEAD > ../repo_flag
          cd ..
          
          # 移除国内下载源 (防止在 Actions 中连接超时)
          PROJECT_MIRRORS_FILE="./action_build/scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Restore Build Dependencies Cache
        if: ${{ github.event.inputs.clean_build != 'true' }}
        uses: actions/cache/restore@v5.0.4
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-${{ hashFiles('repo_flag') }}
          restore-keys: |
            ${{ matrix.os }}-

      - name: Refresh the cache
        if: ${{ github.event.inputs.clean_build != 'true' }}
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Fix gettext build error (防御性修复)
        run: |
          # 这是一个防御性措施。虽然换了脚本可能好了，但为了防止 Ubuntu 24.04 的 gettext 依然有坑，
          # 我们在编译前强制检查并修复一次。
          TARGET_FILE="./action_build/build_dir/hostpkg/gettext-*/gnulib-lib/options.h"
          if ls $TARGET_FILE 1> /dev/null 2>&1; then
             sed -i '/#include <stdcountof.h>/s/^/\/\//' $TARGET_FILE
             echo "已修复 gettext stdcountof.h 问题"
          else
             echo "未找到 gettext 源码目录，跳过修复 (可能尚未解压或无需修复)"
          fi

      - name: Build Firmware
        run: |
          if [ "${{ github.event.inputs.clean_build }}" = "true" ]; then
            echo "=== clean_build：清空全部构建中间产物 ==="
            rm -rf ./action_build/build_dir \
                   ./action_build/staging_dir \
                   ./action_build/tmp \
                   ./action_build/bin
          fi

          PPPOE_USER="${{ github.event.inputs.pppoe_username || '-' }}"
          PPPOE_PASS="${{ github.event.inputs.pppoe_password || '-' }}"
          
          if [ "$PPPOE_USER" != "-" ] || [ "$PPPOE_PASS" != "-" ]; then
            echo "正在配置 PPPoE 账号密码..."
            sed -i "s#^PPPOE_USERNAME=.*#PPPOE_USERNAME=\"$PPPOE_USER\"#" ./nn6000v2/patches/992_network_config.sh
            sed -i "s#^PPPOE_PASSWORD=.*#PPPOE_PASSWORD=\"$PPPOE_PASS\"#" ./nn6000v2/patches/992_network_config.sh
            echo "PPPoE Username: $PPPOE_USER"
            echo "PPPoE Password: [HIDDEN]"
          else
            echo "未输入 PPPoE 账号密码，使用默认值 '-'"
          fi
          
          # 开始编译
          ./nn6000v2/scripts/build.sh ${{ env.DEVICE_MODEL }}
          
          # 获取内核版本用于发布说明
          FIRST_MANIFEST=$(ls ./firmware/immortalwrt-*.manifest 2>/dev/null | head -1)
          if [ -n "$FIRST_MANIFEST" ]; then
            KVER=$(grep "^kernel " "$FIRST_MANIFEST" | grep -oE "[4-6]\.[0-9]+\.[0-9]+" | head -1 || echo "")
            if [ -n "$KVER" ]; then
              echo "KVER=$KVER" >> $GITHUB_ENV
              echo "内核版本：$KVER"
            else
              echo "KVER=unknown" >> $GITHUB_ENV
            fi
          else
            echo "KVER=unknown" >> $GITHUB_ENV
          fi

      - name: Cleanup Old Cache
        continue-on-error: true
        run: |
          echo "=== Cleaning up old caches ==="
          gh cache list || true
          CACHE_PREFIX="${{ matrix.os }}-"
          MATCHING_CACHES=$(gh cache list --json key --jq '.[].key' 2>/dev/null | grep "^${CACHE_PREFIX}" || true)
          if [ -n "$MATCHING_CACHES" ]; then
            echo "$MATCHING_CACHES" | while IFS= read -r key; do
              if [ -n "$key" ]; then
                echo "Deleting: $key"
                gh cache delete "$key" || true
              fi
            done
          fi

      - name: Save Build Dependencies Cache
        uses: actions/cache/save@v5.0.4
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-${{ hashFiles('repo_flag') }}

      - name: Machine Information
        run: |
          lscpu | grep -E "name|Core|Thread"
          df -h

      - name: Prepare Release Body
        run: |
          {
            echo "## 版本信息"
            echo "- 源码：${{ env.BUILD_SRC }}"
            echo "- Kernel: ${{ env.KVER }}"
            echo "- WIFI 密码：147258369"
            echo "- LAN 地址：10.0.0.1"
            echo "- 账户：root"
            echo "- 密码：无"
          } > release_body.txt

      - name: Release Firmware
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ env.DEVICE_MODEL }}
          files: |
            ./firmware/*.bin
            ./firmware/immortalwrt-*.manifest
            ./firmware/*.img.gz
            ./firmware/*.itb
            ./firmware/*.fip
            ./firmware/*.ubi
          body_path: ./release_body.txt
          make_latest: true

      - name: Cleanup Old Versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 保留最新的 10 个 Release
          RELEASES=$(gh release list --json tagName --jq 'sort_by(.tagName) | reverse | .[10:] | .[].tagName')
          if [ -n "$RELEASES" ]; then
            echo "$RELEASES" | while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
            done
          fi
          
          # 保留最新的 10 个工作流记录
          gh run list --workflow release.yml --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].databaseId' | while read -r run_id; do
            if [ -n "$run_id" ]; then
              gh run delete "$run_id" 2>/dev/null || true
            fi
          done