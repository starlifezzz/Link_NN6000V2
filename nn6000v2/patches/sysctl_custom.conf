# ============================================================================
# Link_NN6000V2 custom sysctl settings
#
# 安装位置: /etc/sysctl.d/99-custom.conf (由 system.sh install_custom_sysctl 打入 rootfs)
# 应用时机: 每次开机由 /etc/init.d/sysctl (START=11) 执行
#          (for CONF in /etc/sysctl.d/*.conf /etc/sysctl.conf; do sysctl -e -p ...)
# 持久性  : 该文件属于 rootfs 打包内容, sysupgrade 后由新固件自动提供, 无需 sysupgrade.conf 注册
#
# 设计基线: IPQ6018 (4x A53 @1512MHz, 2GB RAM) + VIKINGYFY 分支 NSS/ECM offload,
#           NAT 网关 + PPPoE + 可选 PBR 多 ISP, BBR (kmod-tcp-bbr)
# ============================================================================

# ---- nf_conntrack: NAT 场景连接跟踪 ----
net.netfilter.nf_conntrack_max = 131072
net.netfilter.nf_conntrack_expect_max = 8192
net.netfilter.nf_conntrack_tcp_timeout_established = 432000
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 120
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 120
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 120
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 60
net.netfilter.nf_conntrack_udp_timeout_stream = 180

# ---- TCP 栈 ----
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_max_tw_buckets = 8192
net.ipv4.tcp_max_orphans = 16384
net.ipv4.tcp_orphan_retries = 2
net.ipv4.tcp_window_scaling = 1
# 2GB 内存设备, 内存充裕可放宽缓冲区 (单连接大窗口; 实际占用随负载动态分配)
net.ipv4.tcp_rmem = 4096 87380 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# ---- Core 网络 ----
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.core.netdev_max_backlog = 5000
net.core.somaxconn = 4096
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_max_syn_backlog = 8192

# ---- 安全加固 (单 WAN NAT 场景安全) ----
# 注意: PBR 多 ISP 非对称路由场景勿开 rp_filter=1, 故此处不设置 rp_filter (保持 OpenWrt 默认)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
